services:
  - type: web
    name: samarth-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false          # you will fill this in the Render dashboard after Vercel gives you your URL
    autoDeploy: true
